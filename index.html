<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GiraffyReach</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#F2F4F3;--surface:#FFFFFF;--surface-2:#EAEEEC;--elevated:#FFFFFF;
  --line:#DCE2E0;--line-soft:#E7ECEA;
  --ink:#0F1A1C;--ink-2:#3C4B4E;--ink-3:#69787B;--ink-4:#95A3A5;
  --accent:#C08327;--accent-ink:#79500F;--accent-wash:#F6ECD5;
  --teal:#2C7A57;--teal-wash:#DBEDE3;
  --good:#128A5E;--good-wash:#DBF1E7;
  --warn:#B4770B;--warn-wash:#FBEED2;
  --crit:#C93446;--crit-wash:#FBE0E3;
  --shadow:0 1px 2px rgba(15,26,28,.04),0 8px 24px -12px rgba(15,26,28,.16);
  --shadow-lg:0 24px 60px -24px rgba(15,26,28,.32);
  --radius:14px;--radius-sm:9px;--nav-w:240px;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1416;--surface:#12242A;--surface-2:#0F1F24;--elevated:#173036;
  --line:#254047;--line-soft:#1B333A;--ink:#EAF2F1;--ink-2:#B4C6C7;--ink-3:#89A0A2;--ink-4:#5E787B;
  --accent:#E4A63E;--accent-ink:#F3DBA6;--accent-wash:#2B2212;--teal:#4FBF8A;--teal-wash:#13291F;
  --good:#4FD39C;--good-wash:#0E2A22;--warn:#EBB24A;--warn-wash:#2C2411;--crit:#F0788A;--crit-wash:#2E1519;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.6);--shadow-lg:0 30px 70px -28px rgba(0,0,0,.75);color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0B1416;--surface:#12242A;--surface-2:#0F1F24;--elevated:#173036;
  --line:#254047;--line-soft:#1B333A;--ink:#EAF2F1;--ink-2:#B4C6C7;--ink-3:#89A0A2;--ink-4:#5E787B;
  --accent:#E4A63E;--accent-ink:#F3DBA6;--accent-wash:#2B2212;--teal:#4FBF8A;--teal-wash:#13291F;
  --good:#4FD39C;--good-wash:#0E2A22;--warn:#EBB24A;--warn-wash:#2C2411;--crit:#F0788A;--crit-wash:#2E1519;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.6);--shadow-lg:0 30px 70px -28px rgba(0,0,0,.75);color-scheme:dark;
}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:"Bricolage Grotesque","Instrument Sans",sans-serif;margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}a{color:var(--teal)}
::selection{background:var(--accent);color:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:var(--nav-w) 1fr;min-height:100vh}
.nav{background:var(--surface-2);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
.spark{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;background:linear-gradient(140deg,var(--accent),#E6C06A);color:#fff;font-size:19px;box-shadow:0 6px 16px -6px var(--accent)}
.brand b{font-family:"Bricolage Grotesque";font-weight:800;font-size:19px;letter-spacing:-.02em}
.brand small{display:block;font-size:10.5px;color:var(--ink-3);letter-spacing:.14em;text-transform:uppercase;margin-top:-2px}
.nav-label{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-4);padding:14px 10px 6px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border:0;background:none;border-radius:9px;color:var(--ink-2);font-size:14px;font-weight:500;width:100%;text-align:left;transition:background .14s,color .14s}
.nav-item:hover{background:var(--surface);color:var(--ink)}
.nav-item.on{background:var(--accent-wash);color:var(--accent-ink);font-weight:600}
.nav-item.on svg{color:var(--accent)}
.nav-item svg{width:18px;height:18px;flex:none;color:var(--ink-3)}
.nav-item .badge{margin-left:auto;font-size:11px;font-weight:700;background:var(--accent);color:#fff;padding:1px 7px;border-radius:20px}
.nav-item .live{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--good);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(18,138,94,.5)}70%{box-shadow:0 0 0 7px rgba(18,138,94,0)}100%{box-shadow:0 0 0 0 rgba(18,138,94,0)}}
.nav-foot{margin-top:auto;padding-top:14px}
.plan-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.plan-card .bar{height:6px;background:var(--surface-2);border-radius:20px;overflow:hidden;margin:8px 0 6px}
.plan-card .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#E6C06A);border-radius:20px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:12px 24px}
.search{flex:1;max-width:440px;position:relative}
.search input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-size:14px}
.search input::placeholder{color:var(--ink-4)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-4)}
.channels{display:flex;gap:6px;margin-left:auto}
.chan{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:5px 10px}
.chan .dot{width:6px;height:6px;border-radius:50%;background:var(--good)}
.iconbtn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);display:grid;place-items:center}
.iconbtn:hover{color:var(--ink);border-color:var(--ink-4)}.iconbtn svg{width:17px;height:17px}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(140deg,var(--teal),#4FD3C7);color:#04302E;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.view{padding:26px 24px 60px;max-width:1200px;width:100%;margin:0 auto;animation:rise .32s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.page-head{margin-bottom:22px}
.page-head .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:6px;font-family:"JetBrains Mono"}
.page-head h1{font-size:30px;font-weight:800;line-height:1.08}
.page-head p{color:var(--ink-3);margin:8px 0 0;max-width:64ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:18px}.grid{display:grid;gap:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 15px;border-radius:10px;font-size:14px;font-weight:600;transition:.14s;text-decoration:none}
.btn:hover{border-color:var(--ink-4)}.btn svg{width:16px;height:16px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 8px 18px -8px var(--accent)}
.btn.pri:hover{filter:brightness(1.05)}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2)}.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}.btn:disabled{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;font-family:"JetBrains Mono"}
.pill.good{background:var(--good-wash);color:var(--good)}.pill.warn{background:var(--warn-wash);color:var(--warn)}
.pill.crit{background:var(--crit-wash);color:var(--crit)}.pill.teal{background:var(--teal-wash);color:var(--teal)}
.pill.accent{background:var(--accent-wash);color:var(--accent-ink)}.pill.neutral{background:var(--surface-2);color:var(--ink-3)}
.tag{font-size:11.5px;font-weight:500;color:var(--ink-2);background:var(--surface-2);border-radius:6px;padding:3px 8px}
.muted{color:var(--ink-3)}.tiny{font-size:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.stat .v{font-family:"Bricolage Grotesque";font-weight:800;font-size:30px;line-height:1;margin:10px 0 4px}
.stat .d{font-size:12.5px;color:var(--ink-3);display:flex;align-items:center;gap:5px}
.stat .spark{position:absolute;right:0;bottom:0}
.up{color:var(--good);font-weight:700}.down{color:var(--crit);font-weight:700}
.dash{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px}
.section-head h3{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.feed{display:flex;flex-direction:column}
.job{display:grid;grid-template-columns:auto 1fr auto auto;gap:13px;padding:14px 16px;border-bottom:1px solid var(--line-soft);align-items:center}
.job:last-child{border-bottom:0}
.logo{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-weight:800;color:#fff;font-family:"Bricolage Grotesque";flex:none;font-size:16px}
.job .t{font-weight:600;font-size:14.5px}
.job .m{font-size:12.5px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:5px 10px;margin-top:3px;align-items:center}
.job .m b{color:var(--ink-2);font-weight:600}
.match{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:52px}
.match .ring{--p:0;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface-2) 0)}
.match .ring span{width:32px;height:32px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:12px;font-weight:700;font-family:"JetBrains Mono"}
.match small{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4)}
.fresh{color:var(--good);font-weight:700}
.board{display:grid;grid-template-columns:repeat(6,minmax(180px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:12px;padding:10px;min-width:180px}
.col h4{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);display:flex;justify-content:space-between;padding:2px 4px 10px}
.col h4 span{color:var(--ink-4)}
.tkt{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:8px;box-shadow:var(--shadow);cursor:grab}
.tkt .co{font-size:12px;color:var(--ink-3)}
.tkt .r{font-weight:600;font-size:13.5px;margin:2px 0 8px;line-height:1.25}
.tkt .foot{display:flex;justify-content:space-between;align-items:center}
.tkt.drag{opacity:.4}.col.over{outline:2px dashed var(--accent);outline-offset:-2px}
.field{margin-bottom:14px}.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
textarea,input[type=text],select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-family:inherit;font-size:14px;resize:vertical}
textarea{line-height:1.55;min-height:120px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.gauge{display:flex;align-items:center;gap:18px}
.gauge .big{--p:0;width:104px;height:104px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface-2) 0)}
.gauge .big span{width:82px;height:82px;border-radius:50%;background:var(--surface);display:grid;place-items:center;flex-direction:column;font-family:"Bricolage Grotesque";font-weight:800;font-size:26px}
.gauge .big span small{font-size:10px;color:var(--ink-3);font-family:"Instrument Sans";font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.kw{display:flex;flex-wrap:wrap;gap:6px}.kw span{font-size:12px;padding:3px 9px;border-radius:20px;font-family:"JetBrains Mono";font-weight:500}
.kw .miss{background:var(--crit-wash);color:var(--crit)}.kw .hit{background:var(--good-wash);color:var(--good)}
.q-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow)}
.q-num{font-family:"JetBrains Mono";color:var(--accent);font-weight:700;font-size:13px}
.frame{background:var(--surface-2);border-left:3px solid var(--teal);border-radius:0 10px 10px 0;padding:12px 14px;margin-top:12px;font-size:13.5px}
.frame b{color:var(--teal)}
.tl{position:relative;padding-left:26px}.tl::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:0 0 18px}.tl-item::before{content:"";position:absolute;left:-22px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:2px solid var(--ink-4)}
.tl-item.on::before{border-color:var(--good);background:var(--good)}.tl-item.act::before{border-color:var(--accent);background:var(--accent);box-shadow:0 0 0 4px var(--accent-wash)}
.tl-item .tt{font-weight:600;font-size:14px}.tl-item .td{font-size:12.5px;color:var(--ink-3)}
.toasts{position:fixed;right:20px;bottom:20px;z-index:100;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--elevated);border:1px solid var(--line);border-left:3px solid var(--good);border-radius:11px;padding:12px 15px;box-shadow:var(--shadow-lg);min-width:260px;max-width:340px;animation:slidein .3s ease}
.toast.accent{border-left-color:var(--accent)}.toast.crit{border-left-color:var(--crit)}
.toast .tt{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:7px}.toast .tb{font-size:12.5px;color:var(--ink-3);margin-top:3px}
@keyframes slidein{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
.row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line-soft)}.row:last-child{border-bottom:0}
.demo-note{font-size:11.5px;color:var(--ink-4);display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);border-radius:20px;padding:3px 10px}
.empty{text-align:center;color:var(--ink-3);padding:40px 20px}.empty svg{width:34px;height:34px;color:var(--ink-4);margin-bottom:8px}
.feat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.feat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.feat .ic{width:36px;height:36px;border-radius:9px;background:var(--accent-wash);color:var(--accent);display:grid;place-items:center;margin-bottom:10px}.feat .ic svg{width:19px;height:19px}
.feat h4{font-size:14.5px;margin-bottom:5px}.feat p{font-size:12.5px;color:var(--ink-3);margin:0}.feat .src{font-size:10.5px;color:var(--ink-4);margin-top:9px;font-family:"JetBrains Mono"}
.skel{height:70px;border-bottom:1px solid var(--line-soft);background:linear-gradient(90deg,var(--surface) 25%,var(--surface-2) 50%,var(--surface) 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:600;padding:5px 12px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.menu-btn{display:none}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:none}
.scrim.on{display:block}
@media(max-width:900px){.app{grid-template-columns:1fr}.nav{position:fixed;left:0;top:0;z-index:60;transform:translateX(-100%);transition:transform .25s;width:250px;box-shadow:var(--shadow-lg)}.nav.open{transform:none}.menu-btn{display:grid}.dash{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.channels{display:none}.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:none}.scrim.on{display:block}}
@media(max-width:560px){.stats{grid-template-columns:1fr 1fr}.view{padding:18px 14px 50px}.topbar{padding:10px 14px}.job{grid-template-columns:auto 1fr auto}}
</style>
</head>
<body>
<div class="app">
  <aside class="nav" id="nav">
    <div class="brand"><div class="spark">🦒</div><div><b>GiraffyReach</b><small>direct-to-source engine</small></div></div>
    <div class="nav-label">Hunt</div>
    <nav id="navmain"></nav>
    <div class="nav-foot"><div class="plan-card">
      <div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:13px">Live sources</b><span class="pill good" id="srcpill">connecting…</span></div>
      <div class="bar"><i style="width:0%" id="srcbar"></i></div>
      <div class="tiny muted" id="srctxt">Fetching real jobs from official ATS APIs</div>
    </div></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="main">
    <header class="topbar">
      <button class="iconbtn menu-btn" id="menu" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input type="text" placeholder="Filter live roles — title, company, location…" id="globalsearch"></div>
      <div class="channels"><span class="chan"><span class="dot"></span>Web</span><span class="chan">Chrome</span><span class="chan">CLI · MCP</span><span class="chan">Mobile</span></div>
      <button class="iconbtn" id="theme" aria-label="Toggle theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <div class="avatar" id="avatar" title="You">SK</div>
    </header>
    <div id="view" class="view"></div>
  </main>
</div>
<div class="toasts" id="toasts"></div>

<script>
/* ================= LIVE JOB SOURCES (official public ATS APIs) ================= */
const BOARDS=[
  {p:"greenhouse",token:"stripe",co:"Stripe",color:"#635BFF"},
  {p:"greenhouse",token:"databricks",co:"Databricks",color:"#FF3621"},
  {p:"greenhouse",token:"figma",co:"Figma",color:"#F24E1E"},
  {p:"greenhouse",token:"airtable",co:"Airtable",color:"#2D7FF9"},
  {p:"greenhouse",token:"gitlab",co:"GitLab",color:"#FC6D26"},
  {p:"greenhouse",token:"anthropic",co:"Anthropic",color:"#CC785C"},
  {p:"greenhouse",token:"coinbase",co:"Coinbase",color:"#0052FF"},
  {p:"greenhouse",token:"retool",co:"Retool",color:"#3A3AFF"},
  {p:"ashby",token:"Ramp",co:"Ramp",color:"#E8A317"},
  {p:"ashby",token:"openai",co:"OpenAI",color:"#111111"},
  {p:"ashby",token:"linear",co:"Linear",color:"#5E6AD2"},
  {p:"ashby",token:"vercel",co:"Vercel",color:"#111111"},
  {p:"remotive",token:"remotive",co:"Remotive",color:"#1FA67A"}, // remote board incl. contract/freelance roles
  // Lever drops in the same way — e.g. {p:"lever",token:"someco",co:"SomeCo",color:"#333"}
];
function hashColor(s){let h=0;for(let i=0;i<(s||"").length;i++)h=(h*31+s.charCodeAt(i))>>>0;return "hsl("+(h%360)+" 52% 46%)";}

/* ============================================================
   YOUR PRIVATE GIRAFFYREACH SOURCE  (optional, set by you)
   Point this at your real API to replace the public sample
   feeds with your own 106k-career-page engine. It is stored
   ONLY in your browser (localStorage) and never sent anywhere
   else. If your API's field names differ, edit adaptGiraffy().

const GIRAFFY_SOURCE={url:"",key:""};                 // hard-code here if you prefer, or set it in Profile → Data source
function giraffyCfg(){try{const c=JSON.parse(localStorage.getItem("giraffy.source"));if(c&&c.url)return c;}catch(e){}return GIRAFFY_SOURCE;}
function adaptGiraffy(raw){
  const arr=Array.isArray(raw)?raw:(raw.jobs||raw.roles||raw.results||raw.data||[]);
  return arr.map((j,i)=>{const co=j.company||j.company_name||j.employer||j.co||"Company";
    return norm({p:"giraffy",token:"live",co:co,color:hashColor(co)},{
      id:j.id||j._id||("g"+i),role:j.title||j.role||j.position||"Role",
      url:j.apply_url||j.url||j.link||j.jobUrl||"#",loc:j.location||j.loc||"",
      dept:j.department||j.category||j.team||"",updated:j.posted_at||j.updated_at||j.created_at||j.date||Date.now(),
      type:j.employment_type||j.type||j.commitment||"",remote:/remote/i.test((j.location||"")+" "+(j.type||""))});});
}
async function fetchGiraffy(){
  const c=giraffyCfg();if(!c.url)return null;
  try{const r=await fetch(c.url,{headers:c.key?{"Authorization":"Bearer "+c.key}:{}});if(!r.ok)throw 0;return adaptGiraffy(await r.json());}
  catch(e){return null;}
}
const MAX_PER_BOARD=40;

async function fetchBoard(b){
  try{
    if(b.p==="greenhouse"){
      const r=await fetch(`https://boards-api.greenhouse.io/v1/boards/${b.token}/jobs?content=false`);
      if(!r.ok)throw 0;const d=await r.json();
      return (d.jobs||[]).slice(0,MAX_PER_BOARD).map(j=>norm(b,{
        id:j.id,role:j.title,url:j.absolute_url,loc:(j.location&&j.location.name)||"",
        dept:(j.departments&&j.departments[0]&&j.departments[0].name)||"",updated:j.updated_at}));
    }
    if(b.p==="ashby"){
      const r=await fetch(`https://api.ashbyhq.com/posting-api/job-board/${b.token}`);
      if(!r.ok)throw 0;const d=await r.json();
      return (d.jobs||[]).slice(0,MAX_PER_BOARD).map(j=>norm(b,{
        id:j.id,role:j.title,url:j.jobUrl||j.applyUrl,loc:j.location||"",
        dept:j.department||j.team||"",updated:j.publishedAt,remote:j.isRemote,type:j.employmentType}));
    }
    if(b.p==="remotive"){
      const r=await fetch("https://remotive.com/api/remote-jobs?limit=140");
      if(!r.ok)throw 0;const d=await r.json();
      return (d.jobs||[]).slice(0,140).map(j=>{const co=j.company_name||"Remote";
        return norm({p:"remotive",token:"remotive",co:co,color:hashColor(co)},{
          id:j.id,role:j.title,url:j.url,loc:j.candidate_required_location||"Remote",
          dept:j.category||"",updated:j.publication_date,type:(j.job_type||"").replace(/_/g," "),remote:true});});
    }
    if(b.p==="lever"){
      const r=await fetch(`https://api.lever.co/v0/postings/${b.token}?mode=json`);
      if(!r.ok)throw 0;const d=await r.json();
      return (d||[]).slice(0,MAX_PER_BOARD).map(j=>norm(b,{
        id:j.id,role:j.text,url:j.hostedUrl,loc:(j.categories&&j.categories.location)||"",
        dept:(j.categories&&j.categories.team)||"",updated:j.createdAt,type:j.categories&&j.categories.commitment}));
    }
  }catch(e){return null;} // board missing / renamed → skip silently
  return [];
}
function norm(b,j){
  const upd=j.updated?new Date(j.updated).getTime():Date.now();
  const remote=j.remote||/remote/i.test(j.loc||"");
  const blob=((j.role||"")+" "+(j.type||"")+" "+(j.dept||"")).toLowerCase();
  const c2c=/c2c|corp.?to.?corp|corp2corp/.test(blob);
  const contract=c2c||/contract|contractor|temporary|\btemp\b|\b1099\b|fixed.?term|freelance/.test(blob);
  return {id:b.p+"_"+b.token+"_"+j.id,co:b.co,color:b.color,role:j.role||"Role",
    loc:j.loc||(remote?"Remote":"—"),dept:j.dept||"",url:j.url||"#",ats:b.p,
    type:j.type||(remote?"Remote":""),updated:upd,remote:remote,contract:contract,c2c:c2c,match:0};
}
function ageMins(t){return Math.max(0,Math.round((Date.now()-t)/60000));}
function ageLabel(t){const m=ageMins(t);if(m<60)return m+"m ago";const h=Math.round(m/60);if(h<24)return h+"h ago";const d=Math.round(h/24);return d+"d ago";}

function load(){let r=null;try{r=JSON.parse(localStorage.getItem(KEY))}catch(e){}

  if(!r.me)r.me=DEFAULT_ME();

function profileKw(){
  const stop=new Set("the a an and or to of in on for with years year experience".split(" "));
  const src=((S.profile||"")+" "+((S.me&&S.me.targets)||"")+" "+((S.me&&S.me.headline)||"")).toLowerCase();
  return [...new Set(src.replace(/[^a-z0-9+ ]/g," ").split(/\s+/).filter(w=>w.length>2&&!stop.has(w)))];
}
function updateAvatar(){const av=document.getElementById('avatar');if(av){const n=((S.me&&S.me.name)||"").trim();av.textContent=n?n.split(/\s+/).map(x=>x[0]).slice(0,2).join("").toUpperCase().slice(0,2):"YOU";}}
function openMail(to,subject,body){location.href="mailto:"+encodeURIComponent(to||"")+"?subject="+encodeURIComponent(subject||"")+"&body="+encodeURIComponent(body||"");}
function scoreJob(j,kw){
  const hay=(j.role+" "+j.dept+" "+j.loc).toLowerCase();
  let hits=0;kw.forEach(k=>{if(hay.includes(k))hits++;});
  let h=0;for(let i=0;i<j.id.length;i++)h=(h*31+j.id.charCodeAt(i))>>>0;
  const jit=h%7;
  const recent=ageMins(j.updated)<1440?4:ageMins(j.updated)<20160?2:0;
  return Math.max(58,Math.min(99,69+hits*8+jit+recent));
}
function rankJobs(){const kw=profileKw();JOBS.forEach(j=>j.match=scoreJob(j,kw));
  JOBS.sort((a,b)=>b.match-a.match||b.updated-a.updated);}

async function loadJobs(){
  let done=0;const all=[];
  const tasks=BOARDS.map(b=>fetchBoard(b).then(r=>{done++;
    const pct=Math.round(done/BOARDS.length*100);
    const bar=document.getElementById("srcbar"),tx=document.getElementById("srctxt"),pl=document.getElementById("srcpill");
    if(bar)bar.style.width=pct+"%";if(pl)pl.textContent=done+"/"+BOARDS.length;
    if(r&&r.length)all.push(...r);return r;}));
  await Promise.all(tasks);
  let liveFeed=false;
  try{const g=await fetchGiraffy();if(g&&g.length){all.length=0;all.push(...g);liveFeed=true;}}catch(e){}
  JOBS=all;rankJobs();LOADED=true;
  const ok=[...new Set(all.map(j=>j.co))];
  const pl=document.getElementById("srcpill"),tx=document.getElementById("srctxt");
  if(pl){pl.textContent=liveFeed?"your feed":ok.length+" live";pl.className="pill good";}
  if(tx)tx.innerHTML=`<b style="color:var(--ink)">${JOBS.length}</b> ${liveFeed?'live roles · your engine':'roles · '+ok.length+' companies'}`;
  document.querySelector('.nav-item[data-v="radar"] .live')&&0;
  const b=document.querySelector('.nav-item[data-v="radar"]');
  if(b){const badge=b.querySelector('.badge');}
  if(CUR==="radar"||CUR==="dashboard")render(CUR);
}

function logo(co,color){return `<div class="logo" style="background:${color}">${esc(co[0])}</div>`}
function ring(p){return `<div class="match"><div class="ring" style="--p:${p}"><span>${p}</span></div><small>match</small></div>`}
function sparkline(pts,color){const w=88,h=34,mx=Math.max(...pts),mn=Math.min(...pts),dx=w/(pts.length-1);
  const y=v=>h-4-((v-mn)/((mx-mn)||1))*(h-8);let d=pts.map((v,i)=>`${i?'L':'M'}${(i*dx).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" fill="none"><path d="${d}L${w} ${h}L0 ${h}Z" fill="${color}" opacity=".12"/><path d="${d}" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${w}" cy="${y(pts[pts.length-1])}" r="2.6" fill="${color}"/></svg>`;}
function toast(t,b,cls){const el=document.createElement("div");el.className="toast"+(cls?" "+cls:"");
  el.innerHTML=`<div class="tt">${cls==="crit"?"⚠":cls==="accent"?"⚡":"✓"} ${t}</div>${b?`<div class="tb">${b}</div>`:""}`;
  $("#toasts").appendChild(el);setTimeout(()=>{el.style.transition=".3s";el.style.opacity=0;el.style.transform="translateX(20px)";setTimeout(()=>el.remove(),300)},3800);}

function renderRadar(){

window.scanATS=()=>{
  const res=($("#res-r").value||"").toLowerCase(),jd=($("#res-j").value||"").toLowerCase();
  const stop=new Set("the a an and or to of in on for with we you seek skilled experience required strong is are as at be by from this that our your role team".split(" "));
  const words=[...new Set(jd.replace(/[^a-z0-9+ ]/g," ").split(/\s+/).filter(w=>w.length>2&&!stop.has(w)))];
  const hits=words.filter(w=>res.includes(w)),miss=words.filter(w=>!res.includes(w));
  const score=Math.round(hits.length/(words.length||1)*100);
  $("#ats-out").innerHTML=`<h3 style="margin-bottom:14px">Scan result</h3>
    <div class="gauge"><div class="big" style="--p:${score}"><span>${score}<small>ATS score</small></span></div>
      <div><div class="pill ${score>=75?'good':score>=55?'warn':'crit'}" style="font-size:13px;margin-bottom:8px">${score>=75?'Strong match — ship it':score>=55?'Add missing keywords':'Rework before applying'}</div>

V.tracker=()=>`<div class="page-head"><div class="eyebrow">Pipeline · Track</div><h1>Tracker</h1>

  ${S.pipeline.length?`<div class="board" id="board">${STAGES.map(s=>`<div class="col" data-stage="${s}" ondragover="dover(event)" ondragleave="dleave(event)" ondrop="ddrop(event)"><h4>${STAGE_LABEL[s]} <span>${S.pipeline.filter(p=>p.stage===s).length}</span></h4>${S.pipeline.filter(p=>p.stage===s).map(tkt).join("")}</div>`).join("")}</div>

function tkt(p){return `<div class="tkt" draggable="true" data-id="${p.id}" ondragstart="dstart(event)" ondragend="dend(event)">
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:2px">${logo(p.co,p.color)}<span class="co">${esc(p.co)}</span></div>
  <div class="r">${esc(p.role)}</div><div class="foot"><span class="pill neutral" style="font-size:10px">${p.ats}</span><span class="mono tiny" style="color:${p.match>=90?'var(--good)':p.match>=80?'var(--teal)':'var(--warn)'};font-weight:700">${p.match}%</span></div></div>`;}
let dragId=null;
window.dstart=e=>{dragId=e.target.dataset.id;e.target.classList.add('drag');};
window.dend=e=>e.target.classList.remove('drag');
window.dover=e=>{e.preventDefault();e.currentTarget.classList.add('over');};
window.dleave=e=>e.currentTarget.classList.remove('over');
window.ddrop=e=>{e.preventDefault();e.currentTarget.classList.remove('over');const stage=e.currentTarget.dataset.stage;const p=S.pipeline.find(x=>x.id===dragId);if(p&&p.stage!==stage){p.stage=stage;save();render('tracker');toast("Moved to "+STAGE_LABEL[stage],p.co+" · "+p.role);}};

};

/* ================= ROUTER ================= */
let CUR="dashboard";
function render(v){CUR=v;document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('on',n.dataset.v===v));$("#view").innerHTML=(V[v]||V.dashboard)();updateAvatar();window.scrollTo(0,0);}
window.go=v=>{render(v);closeNav();};
function paintBadges(){const b=document.querySelector('.nav-item[data-v="tracker"] .badge');if(b)b.textContent=S.pipeline.length;}

$("#navmain").innerHTML=NAV.map((n,i)=>{const[v,label,,extra]=n;
  const tail=extra==="live"?'<span class="live"></span>':(v==="tracker"?`<span class="badge">${S.pipeline.length}</span>`:'');
  return `<button class="nav-item ${i===0?'on':''}" data-v="${v}" onclick="go('${v}')">${icon(n[2])}<span>${label}</span>${tail}</button>`;}).join("");

(function(){const saved=(()=>{try{return localStorage.getItem('crackit.theme')}catch(e){return null}})();
  if(saved)document.documentElement.setAttribute('data-theme',saved);
  $("#theme").onclick=()=>{const cur=document.documentElement.getAttribute('data-theme');const dark=cur?cur==='dark':matchMedia('(prefers-color-scheme:dark)').matches;const next=dark?'light':'dark';document.documentElement.setAttribute('data-theme',next);try{localStorage.setItem('crackit.theme',next)}catch(e){}};})();

function closeNav(){$("#nav").classList.remove('open');$("#scrim").classList.remove('on');}
$("#menu").onclick=()=>{$("#nav").classList.add('open');$("#scrim").classList.add('on');};
$("#scrim").onclick=closeNav;
let stoTimer;$("#globalsearch").addEventListener('input',e=>{RADSEARCH=e.target.value;clearTimeout(stoTimer);stoTimer=setTimeout(()=>{if(CUR!=="radar")render("radar");else{const f=$("#radarfeed");if(f)f.innerHTML=renderRadar();}},180);});

render('dashboard');
loadJobs();
</script>
</body>
</html>
