# One-click deploy on Render (https://render.com). Push this repo, then "New → Blueprint".
services:
  - type: web
    name: giraffyreach-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false          # set this yourself in the Render dashboard (secret)
      - key: ANTHROPIC_MODEL
        value: claude-opus-5
      - key: DB_PATH
        value: /var/data/giraffyreach.db
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
